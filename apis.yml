name: InkSoft
kind: company
description: InkSoft is a custom apparel e-commerce, online store, and design
  platform for screen printers, embroiderers, and print shops - part of the
  Inktavo family alongside Printful and GraphicsFlow. It provides hosted online
  stores, a browser-based Design Studio, product catalogs, art/clip-art
  libraries, and order management. InkSoft exposes a documented but
  license-gated developer surface, the InkSoft API 2, a per-store RPC-style HTTP
  API returning XML or JSON with CORS support. It lets partners and store owners
  build custom storefronts, product catalog pages, design galleries, cart and
  checkout flows, and single sign-on against a specific web store. API access
  requires an InkSoft Unlimited license and an additional monthly fee, so the
  reference is public but production use is account-gated.
